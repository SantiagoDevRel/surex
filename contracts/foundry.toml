[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# `resolve()` reverts with OffchainLookup by design; via-ir is not needed and
# keeps compile times honest for a contract this small.
via_ir = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
